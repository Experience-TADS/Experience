name: Pipeline Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'api/**'
      - '.github/workflows/pipeline-be.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'api/**'
      - '.github/workflows/pipeline-be.yaml'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # O backend vive na subpasta api/, então todos os comandos rodam a partir dela
    defaults:
      run:
        working-directory: api
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Compilar código com mvn
      - name: Compile Application
        run: mvn clean compile -B

      # Segurança e validação de dependências (SCA) com Trivy.
      # Substitui o OWASP Dependency-Check, que falhava com "bytes is null" por
      # instabilidade da API da NVD. O Trivy usa sua própria base de vulnerabilidades
      # (que agrega NVD, GitHub Advisory e outras) e não exige chave de API.
      # A action é pinada por SHA (v0.36.0) por segurança, após o incidente de
      # supply chain de 2026 — nunca use tags móveis como @master aqui.
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # fs = escaneia o sistema de arquivos do projeto (resolve as deps do pom.xml em api/)
          scan-type: 'fs'
          scan-ref: 'api'
          # Só análise de vulnerabilidades de dependências
          scanners: 'vuln'
          # Falha o build em CVEs High/Critical — mesmo gate que o OWASP tinha (CVSS >= 7)
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          # Só reporta CVEs que já têm correção disponível (evita ruído sem ação possível)
          ignore-unfixed: true
          format: 'table'
        env:
          # Autentica no registro público da base do Trivy com o token que o GitHub
          # Actions já fornece, evitando rate limit anônimo no download da base.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # Roda os testes e valida a cobertura via JaCoCo.
      # Usamos a fase "verify" (em vez de invocar jacoco:check pela CLI) porque as
      # <rules> de cobertura estão ligadas à execução "check" na fase verify do pom.
      # Chamar o goal solto pela linha de comando não enxerga essas rules, o que
      # causava o erro "parameters 'rules' ... are missing or invalid".
      # -DskipITs pula os testes de integração (Failsafe) nesta etapa.
      - name: Run Unit Tests & Verify Coverage Threshold
        run: mvn verify -DskipITs -B

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: api/target/site/jacoco/

      # próx: testes automatizados com restassured + testcontainers

      # - name: Run Integration Tests (Failsafe Plugin)
