name: Pipeline Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'api/**'
      - '.github/workflows/pipeline-be.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'api/**'
      - '.github/workflows/pipeline-be.yaml'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # O backend vive na subpasta api/, então todos os comandos rodam a partir dela
    defaults:
      run:
        working-directory: api
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Compilar código com mvn
      - name: Compile Application
        run: mvn clean compile -B

      # Cacheia o banco local da NVD entre execuções, evitando rebaixar ~400 mil
      # registros toda vez (o que dispara rate limit / instabilidade da API da NVD).
      # Prefixo "v2-": invalida caches antigos, que guardaram uma base VAZIA gerada
      # enquanto a chave NVD ainda não estava ativa. O restore-keys só reaproveita
      # caches do mesmo prefixo v2, nunca os antigos quebrados.
      - name: Cache NVD Database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-v2-${{ github.run_id }}
          restore-keys: |
            nvd-data-v2-

      # Segurança e validação de dependências (SCA).
      # continue-on-error: a NVD tem instabilidades conhecidas que fazem o plugin
      # falhar com "NullPointerException: bytes is null" ao atualizar a base de CVEs
      # — um problema externo, não do nosso código. Não deixamos isso derrubar o
      # build inteiro; o resultado fica registrado no step e no relatório (artefato).
      - name: Run OWASP Dependency-Check
        id: dependency_check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # nvdApiDelay: espera entre requisições à NVD (ms), reduz rate limit
        # nvdMaxRetryCount: tentativas antes de desistir em falhas de rede
        run: >
          mvn org.owasp:dependency-check-maven:check -B
          -DnvdApiDelay=6000
          -DnvdMaxRetryCount=10

      # Guarda o relatório do Dependency-Check (quando gerado) para inspeção manual
      - name: Upload Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: api/target/dependency-check-report.*
          if-no-files-found: ignore

      # Sinaliza no log quando a análise SCA não passou, sem quebrar o pipeline
      - name: Warn if Dependency-Check Failed
        if: steps.dependency_check.outcome == 'failure'
        run: echo "::warning::OWASP Dependency-Check não concluiu (provável instabilidade da NVD). Verifique o artefato dependency-check-report quando disponível."

      # Roda os testes e valida a cobertura via JaCoCo.
      # Usamos a fase "verify" (em vez de invocar jacoco:check pela CLI) porque as
      # <rules> de cobertura estão ligadas à execução "check" na fase verify do pom.
      # Chamar o goal solto pela linha de comando não enxerga essas rules, o que
      # causava o erro "parameters 'rules' ... are missing or invalid".
      # -DskipITs pula os testes de integração (Failsafe) nesta etapa.
      - name: Run Unit Tests & Verify Coverage Threshold
        run: mvn verify -DskipITs -B

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: api/target/site/jacoco/

      # próx: testes automatizados com restassured + testcontainers

      # - name: Run Integration Tests (Failsafe Plugin)
      #   # Executa as classes de teste que terminam em *IT.java (ex: UsuarioControllerIT.java)
      #   run: mvn verify -Dskip.unit.tests=true -B

      # - name: Upload Integration Test Reports
