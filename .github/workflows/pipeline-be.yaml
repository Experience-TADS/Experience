name: Pipeline Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'api/**'
      - '.github/workflows/pipeline-be.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'api/**'
      - '.github/workflows/pipeline-be.yaml'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # O backend vive na subpasta api/, então todos os comandos rodam a partir dela
    defaults:
      run:
        working-directory: api
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Compilar código com mvn
      - name: Compile Application
        run: mvn clean compile -B

      # Cacheia o banco local da NVD entre execuções, evitando rebaixar ~400 mil
      # registros toda vez (o que dispara rate limit / instabilidade da API da NVD).
      # Prefixo "v2-": invalida caches antigos, que guardaram uma base VAZIA gerada
      # enquanto a chave NVD ainda não estava ativa. O restore-keys só reaproveita
      # caches do mesmo prefixo v2, nunca os antigos quebrados.
      - name: Cache NVD Database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-v2-${{ github.run_id }}
          restore-keys: |
            nvd-data-v2-

      # segurança e validação de dependências
      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # nvdApiDelay: espera entre requisições à NVD (ms), reduz rate limit
        # nvdMaxRetryCount: tentativas antes de desistir em falhas de rede
        run: >
          mvn org.owasp:dependency-check-maven:check -B
          -DnvdApiDelay=6000
          -DnvdMaxRetryCount=10

      # rodar testes unitários e cobertura de código utilizando JaCoCo
      - name: Run Unit Tests & Verify Coverage Threshold
        run: mvn test jacoco:report jacoco:check -B

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: api/target/site/jacoco/

      # próx: testes automatizados com restassured + testcontainers

      # - name: Run Integration Tests (Failsafe Plugin)
