spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=dGVzdGVTZWNyZXRLZXlGb3JKd3RUb2tlbnNUZXN0ZVNlY3JldEtleUZvckp3dA==
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# S-008: no perfil de teste a suite inteira compartilha o mesmo contexto e o mesmo IP
# de loopback, entao o limite default (5) estouraria entre os testes. Eleva o limite
# aqui para nao interferir nos demais testes; o LoginRateLimitRestAssuredTest sobrescreve
# para um valor baixo via @TestPropertySource (contexto isolado) e valida o 429.
ratelimit.login.max-tentativas=10000
ratelimit.login.janela-minutos=10
