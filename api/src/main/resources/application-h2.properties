# ============================================================
# Perfil H2 — banco em memória, para testar o startup e a API
# sem depender do PostgreSQL/container.
#
# Uso:
#   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=h2
#
# Console web do H2 disponível em: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:experience
#   User:     sa   (sem senha)
# ============================================================

# DataSource H2 em memória
spring.datasource.url=jdbc:h2:mem:experience;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
