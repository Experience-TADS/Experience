spring.application.name=experience
spring.h2.console.enabled=false
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/db_experience
spring.datasource.username=postgres
spring.datasource.password=12345


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# # Debug de segurança — remover após diagnóstico
# logging.level.org.springframework.security=TRACE
# logging.level.org.springframework.web=DEBUG

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Chave secreta JWT (Base64, minimo 256 bits)
jwt.secret=dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9yand0dG9rZW5zMTIzNDU2Nzg=

# S-Card 1: tokens. Access token de curta duracao + refresh token com rotacao.
# Configuraveis via JWT_ACCESS_TOKEN_TTL_MINUTOS e JWT_REFRESH_TOKEN_TTL_DIAS.
jwt.access-token.ttl-minutos=15
jwt.refresh-token.ttl-dias=7

# S-008: rate limiting do login (por IP). Configuravel via RATELIMIT_LOGIN_MAX_TENTATIVAS e RATELIMIT_LOGIN_JANELA_MINUTOS.
ratelimit.login.max-tentativas=5
ratelimit.login.janela-minutos=10

# MQTT
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=backend-experience
mqtt.topic.fabricacao.status=experience/fabricacao/+/status
mqtt.topic.fabricacao.sensor=experience/fabricacao/+/sensor
