spring.application.name=experience
spring.h2.console.enabled=false
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/db_experience
spring.datasource.username=postgres
spring.datasource.password=12345


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# # Debug de segurança — remover após diagnóstico
# logging.level.org.springframework.security=TRACE
# logging.level.org.springframework.web=DEBUG

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Chave secreta JWT (Base64, minimo 256 bits)
jwt.secret=dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9yand0dG9rZW5zMTIzNDU2Nzg=

# MQTT — broker URL pode ser sobrescrita por variável de ambiente MQTT_BROKER_URL
# Docker: tcp://mqtt:1883  |  Dev local: tcp://localhost:1883
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=backend-experience
# Tópico real publicado pelo ESP32 / simulador
mqtt.topic.esp32=senai/pii_toy
