listener 1883

# WebSocket para o simulador web (mqtt/simulador-web)
listener 9001
protocol websockets

allow_anonymous true
persistence false

# Fila por cliente lento (ex.: API durante a Simulação Extrema). Padrão 1000 descartava eventos; bytes limita a RAM.
max_queued_messages 10000
max_queued_bytes 50000000
