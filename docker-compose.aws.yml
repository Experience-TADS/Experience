services:

  # ─── API SPRING BOOT ───────────────────────────────────────────────────────
  api:
    build:
      context: ./api/experience
      dockerfile: Dockerfile
    container_name: experience-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── CHATBOT FLASK ─────────────────────────────────────────────────────────
  chatbot:
    build:
      context: ./web
      dockerfile: Dockerfile.flask
    container_name: experience-chatbot
    restart: unless-stopped
    ports:
      - "5000:5000"

  # ─── MQTT / IOT ────────────────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    container_name: experience-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  simulador:
    build:
      context: ./mqtt/simulador
      dockerfile: Dockerfile
    container_name: experience-simulador
    restart: unless-stopped
    depends_on:
      - mqtt

  nodered:
    image: nodered/node-red
    container_name: experience-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    depends_on:
      - mqtt
    volumes:
      - nodered_data:/data

  # ─── TIME-SERIES / DASHBOARD ───────────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: experience-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-admin123}
      DOCKER_INFLUXDB_INIT_ORG: senai
      DOCKER_INFLUXDB_INIT_BUCKET: linha_producao
      TZ: America/Sao_Paulo
    volumes:
      - influxdb_data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana
    container_name: experience-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_DEFAULT_APP_MODE: production
      TZ: America/Sao_Paulo
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  influxdb_data:
  nodered_data:
  grafana_data:
